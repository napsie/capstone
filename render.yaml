services:
  # Main PHP Web Service
  - type: web
    name: carelink-php
    runtime: php
    plan: free
    build:
      - command: "composer install --no-dev --optimize-autoloader"
    startCommand: "vendor/bin/heroku-php-apache2 ."
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carelink-db
          property: connectionString
      - key: DOCUMENT_ROOT
        value: .

databases:
  # PostgreSQL Database
  - name: carelink-db
    plan: free
